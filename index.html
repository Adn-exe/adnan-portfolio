<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adnan's Portfolio</title>
  <link rel="icon" type="image/png" href="/image.png" />
  <link rel="apple-touch-icon" href="/image.png" />
  <link rel="preload" as="image" href="/aboutmeDark.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/aboutmeLight.webp" type="image/webp" fetchpriority="high" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Martel+Sans:wght@400;600;700;800&family=Montserrat:wght@100..900&family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/google-sans">
  <script>
    // Listen for Hard Refresh hotkeys (Cmd+Shift+R or Ctrl+Shift+R) to clear loader session flag
    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'r' || e.key === 'R')) {
        try { sessionStorage.removeItem('portfolio_has_loaded'); } catch (err) {}
      }
    });

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    try {
      if (localStorage.getItem('portfolio-theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    } catch (e) {}
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            about: ['Montserrat', 'sans-serif'],
            martel: ['"Martel Sans"', 'sans-serif'],
            lora: ['Lora', 'serif'],
          },
          colors: {
            primary: 'var(--bg-primary)',
            accent: 'var(--accent)',
            'accent-purple': '#A855F7',
            surface: 'var(--bg-surface)',
            'theme-text': 'var(--text-primary)',
            'theme-secondary': 'var(--text-secondary)',
            'theme-border': 'var(--border-color)',
          },
        },
        animation: {

          'float': 'float 8s ease-in-out infinite',
          'reveal': 'reveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          'scanline': 'scanline 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',  /* deprecated */
          'fadeIn': 'fadeIn 0.4s ease-out forwards',
          'slideUp': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          'spin-slow': 'spin 12s linear infinite',
          'gradient': 'gradient 8s linear infinite',
          'glitch': 'glitch 0.3s ease-in-out',  /* deprecated */
          'breathe': 'breathe 3s ease-in-out infinite',
          'shimmer': 'shimmer 2s linear infinite',

          'scatter': 'scatter 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
        },
        keyframes: {
          float: {
            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
            '50%': { transform: 'translateY(-30px) rotate(2deg)' },
          },
          reveal: {
            '0%': { opacity: '0', transform: 'translateY(100%) skewY(5deg)' },
            '100%': { opacity: '1', transform: 'translateY(0) skewY(0deg)' },
          },
          scanline: {
            '0%': { transform: 'translateY(-100%)' },
            '100%': { transform: 'translateY(200%)' },
          },
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          slideUp: {
            '0%': { opacity: '0', transform: 'translateY(60px) scale(0.98)' },
            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
          },
          gradient: {
            '0%, 100%': { 'background-position': '0% 50%' },
            '50%': { 'background-position': '100% 50%' },
          },

          glitch: {
            '0%': { transform: 'translate(0)', filter: 'hue-rotate(0deg)' },
            '20%': { transform: 'translate(-2px, 2px)', filter: 'hue-rotate(90deg)' },
            '40%': { transform: 'translate(-2px, -2px)', filter: 'hue-rotate(180deg)' },
            '60%': { transform: 'translate(2px, 2px)', filter: 'hue-rotate(270deg)' },
            '80%': { transform: 'translate(2px, -2px)', filter: 'hue-rotate(360deg)' },
            '100%': { transform: 'translate(0)', filter: 'hue-rotate(0deg)' },
          },
          breathe: {
            '0%, 100%': { transform: 'scale(1)', opacity: '0.6' },
            '50%': { transform: 'scale(1.05)', opacity: '1' },
          },
          shimmer: {
            '0%': { transform: 'translateX(-100%)' },
            '100%': { transform: 'translateX(100%)' },
          },
          particleFloat: {
            '0%, 100%': { transform: 'translateY(0) translateX(0)' },
            '25%': { transform: 'translateY(-10px) translateX(5px)' },
            '50%': { transform: 'translateY(0) translateX(10px)' },
            '75%': { transform: 'translateY(10px) translateX(5px)' },
          },

          scatter: {
            '0%': { transform: 'translate(0, 0) scale(1)', opacity: '1' },
            '100%': { transform: 'translate(var(--scatter-x, 100px), var(--scatter-y, 100px)) scale(0)', opacity: '0' },
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #00D1FF, #FFFFFF);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #F8FAFC;
    }

    :root {
      --bg-primary: #000000;
      --bg-surface: #121212;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.05);
      --navbar-bg: rgba(0, 5, 10, 0.9);
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #00D1FF;
      --accent-color: #00D1FF;
    }

    .light {
      --bg-primary: #FAF8F2; /* Luxurious Warm White / Ivory */
      --bg-surface: #F3EEE3; /* Warm Champagne Gold Tint */
      --text-primary: #1F1A14; /* Deep Warm Charcoal */
      --text-secondary: #706554; /* Warm Slate Gold */
      --border-color: rgba(180, 130, 20, 0.15); /* Soft Gold Border */
      --navbar-bg: rgba(250, 248, 242, 0.92);
      --card-bg: rgba(243, 238, 227, 0.7);
      --accent: #D97706; /* Rich Champagne Amber Gold Accent */
      --accent-color: #D97706;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
    }

    .light .glass {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(180, 130, 20, 0.18);
      box-shadow: 0 10px 30px rgba(180, 130, 20, 0.08);
    }

    .text-glow-cyan {
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .text-gradient {
      background: linear-gradient(to right, #00D1FF, var(--text-primary), #00D1FF);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 5s linear infinite;
    }

    .light .text-gradient {
      background: linear-gradient(to right, #B45309, #1F1A14, #D97706);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 5s linear infinite;
    }



    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .premium-spacing {
      word-spacing: 0.15rem;
    }
    .custom-cursor-icon {
      filter: invert(1);
    }
    .light .custom-cursor-icon {
      filter: invert(0);
    }
    .invert-in-dark {
      filter: invert(1);
      transition: filter 0.4s ease;
    }
    .light .invert-in-dark {
      filter: invert(0);
    }
    .font-lora {
      font-family: 'Lora', Georgia, serif;
    }

    /* Enforce custom cursor across entire site and disable default browser hand/pointer cursors on desktop */
    @media (pointer: fine) {
      *, *::before, *::after {
        cursor: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
